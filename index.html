            updateSubmitModalUI(typeId) {
                const t = this.reportTypes.find(x => x.id === typeId);
                if (t) {
                    document.getElementById('metric-label-display').innerText = `${t.metricLabel} (${t.unit})`;
                    document.getElementById('file-format-hint').innerText = `Required Name: ${t.label} -[Details].pdf / xlsx`;
                }
            },

            handleReportFileSelect(input) {
                const typeId = document.getElementById('report-type-select').value;
                const typeDef = this.reportTypes.find(t => t.id === typeId);
                const fileText = document.getElementById('file-upload-text');
                const metricInput = document.getElementById('metric-value-input');

                if (input.files && input.files[0]) {
                    const file = input.files[0];
                    const fileName = file.name;

                    // 1. Name Validation
                    if (!fileName.toLowerCase().includes(typeDef.label.toLowerCase())) {
                        this.toast(`File name MUST contain "${typeDef.label}"`, 'error');
                        input.value = '';
                        fileText.innerText = "Invalid Name. Try Again.";
                        fileText.classList.add('text-red-500');
                        metricInput.value = '';
                        return;
                    }

                    fileText.innerText = fileName;
                    fileText.classList.remove('text-red-500');
                    fileText.classList.add('text-brand-600', 'font-bold');

                    // 2. Parse File for Metric Calculation
                    metricInput.placeholder = "Calculating...";

                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        await App.loadSheetJS();
                        const data = new Uint8Array(e.target.result);
                        try {
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];

                            // Convert sheet to JSON (array of arrays)
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                            if (jsonData.length <= 1) {
                                metricInput.value = 0;
                                this.toast("File appears empty.");
                                return;
                            }

                            // INTELLIGENT CALCULATION LOGIC
                            let calculatedValue = 0;
                            const headers = jsonData[0].map(h => String(h).toLowerCase().trim());
                            const totalColIndex = headers.indexOf('total');

                            /* ================================================
                             * SMART ANALYTICS PARSER - v3.0
                             * Dispatches to type-specific parsing logic.
                             * Each parser produces a stats object stored
                             * with the report for analytics aggregation.
                             * ================================================ */
                            const findCol = (name) => headers.findIndex(h => h.includes(name.toLowerCase()));
                            const getVal = (row, idx) => idx !== -1 ? String(row[idx] || '').trim() : '';
                            const getNum = (row, idx) => idx !== -1 ? parseFloat(row[idx]) : NaN;
                            const isYes = (v) => ['yes', 'y', 'true', '1'].includes(v.toLowerCase());

                            // ---- DEDUPLICATION LOGIC ----
                            const seenRows = new Set();
                            const rawDataRows = jsonData.slice(1).filter(r => r && r.length > 0 && r.some(c => c !== null && c !== undefined && String(c).trim() !== ''));

                            const dataRows = [];
                            rawDataRows.forEach(row => {
                                // Create a normalized string representation of the row for comparison
                                const rowString = JSON.stringify(row.map(cell => String(cell || '').trim().toLowerCase()));
                                if (!seenRows.has(rowString)) {
                                    seenRows.add(rowString);
                                    dataRows.push(row);
                                }
                            });

                            if (rawDataRows.length > dataRows.length) {
                                this.toast(`Filtered ${rawDataRows.length - dataRows.length} duplicate entries.`);
                            }

                            let stats = {};

                            // ---- LEARNER PROFILE ----

            async handleSubmitReport(e) {
                e.preventDefault();
                // Cooldown Check
                if (Date.now() - this.lastReportTime < 30000) {
                    const remaining = Math.ceil((30000 - (Date.now() - this.lastReportTime)) / 1000);
                    this.toast(`Please wait ${remaining}s before submitting again.`, 'error');
                    return;
                }

                const formData = new FormData(e.target);
                const typeId = formData.get('typeId');
                const typeDef = this.reportTypes.find(t => t.id === typeId);
                const fileInput = e.target.querySelector('input[type="file"]');
                const file = fileInput ? fileInput.files[0] : null;

                if (!file) {
                    this.toast('Please select a document file to submit.', 'error');
                    return;
                }

                // --- CHECK FOR EXISTING REPORT BY THIS USER ---
                const existingReport = this.reports.find(r => r.typeId === typeId && r.userId === this.user.id);

                const processSubmission = async () => {
                    const btn = document.querySelector('#modal-content button[type="submit"]') || (e.target ? e.target.querySelector('button[type="submit"]') : null);
                    const originalText = btn ? btn.innerHTML : 'Submit Report';
                    if (btn) {
                        btn.disabled = true;
                        btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Uploading & Submitting...';
                    }
                    this.toast('Processing document submission...', 'info');
                    this.showLoader(true);

                    try {
                        let fileUrl = '';
                        // Use chunked upload for file upload safety & progress
                        if (file.size > 100 * 1024) {
                            fileUrl = await this.uploadFileChunked(file);
                        } else {
                            // Convert small files to base64 inline
                            fileUrl = await new Promise((res) => {
                                const r = new FileReader();
                                r.onload = (re) => res(re.target.result);
                                r.readAsDataURL(file);
                            });
                        }

                        const newReport = {
                            id: Date.now(),
                            userId: this.user.id,
                            user: `${this.user.firstName} ${this.user.lastName}`,
                            typeId: typeId,
                            typeLabel: typeDef ? typeDef.label : typeId,
                            metricValue: formData.get('metricValue'),
                            unit: typeDef.unit || '',
                            date: new Date().toISOString(),
                            fileName: file.name,
                            fileUrl: fileUrl.startsWith('data:') ? '' : fileUrl,
                            fileData: fileUrl.startsWith('data:') ? fileUrl : '',
                            stats: this.tempStats || {}
                        };

                        if (existingReport) {
                            await this.api('deleteReport', { id: existingReport.id });
                            this.reports = this.reports.filter(r => r.id !== existingReport.id);
                        }
                        await this.api('submitReport', newReport);
                        this.reports.push(newReport);
                        this.lastReportTime = Date.now();
                        this.toast('Report Submitted Successfully!');
                        this.closeModal();
                        this.renderReports(document.getElementById('main-view'));
                    } catch (err) {
                        this.toast('Submission failed: ' + err.message, 'error');
                    } finally {
                        this.showLoader(false);
                        if (btn) {
                            btn.disabled = false;
                            btn.innerHTML = originalText;
                        }
                    }
                };

                if (existingReport) {
                    const existingDate = this.formatDate(existingReport.date) || new Date(existingReport.date).toLocaleDateString();
                    const warningMessage = `You have already submitted a report for this category.<br><br>` +
                        `<b class="text-gray-800">Previous File:</b> ${existingReport.fileName || 'Unknown file'}<br>` +
                        `<b class="text-gray-800">Date Submitted:</b> ${existingDate}<br><br>` +
                        `<span class="text-red-600 font-bold tracking-wide">Are you sure you want to overwrite your previous submission with this new file?</span>`;

                    this.askConfirm("Overwrite Existing Report?", warningMessage, async () => {
                        await processSubmission();
                    });
                } else {
                    await processSubmission();
                }
            },

                    if (newPw) {

                        await this.api('updateProfile', u); // Re-using profile update logic as admin

                    // Assuming deleteUser action
                    // await this.api('deleteUser', {id: userId});

            async uploadFileChunked(file, onProgress) {
                const CHUNK_SIZE = 150 * 1024;
                const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                const uploadId = 'UPL-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

                this.showUploadProgress(0, file.name);

                for (let i = 0; i < totalChunks; i++) {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(file.size, start + CHUNK_SIZE);
                    const chunkBlob = file.slice(start, end);

                    const base64Chunk = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(chunkBlob);
                    });

                    let attempts = 0;
                    let success = false;
                    let lastRes = null;

                    while (attempts < 3 && !success) {
                        try {
                            attempts++;
                            lastRes = await this.api('uploadChunk', {
                                uploadId: uploadId,
                                chunkIndex: i,
                                totalChunks: totalChunks,
                                chunkData: base64Chunk,
                                fileName: file.name,
                                mimeType: file.type
                            });
                            if (lastRes && lastRes.status === 'success') {
                                success = true;
                            }
                        } catch (e) {
                            console.warn(`Chunk ${i} attempt ${attempts} failed`, e);
                            await new Promise(r => setTimeout(r, 1000 * attempts));
                        }
                    }

                    if (!success) {
                        this.hideUploadProgress();
                        throw new Error(`Upload failed at chunk ${i + 1} of ${totalChunks}. Check internet connection and retry.`);
                    }

                    const pct = Math.round(((i + 1) / totalChunks) * 100);
                    this.showUploadProgress(pct, file.name);
                    if (onProgress) onProgress(pct);

                    if (lastRes && lastRes.assembled) {
                        this.hideUploadProgress();
                        return lastRes.fileUrl;
                    }
                }
                this.hideUploadProgress();
                throw new Error('Upload assembly failed.');
            },

            showUploadProgress(percent, filename) {
                let overlay = document.getElementById('upload-progress-overlay');
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'upload-progress-overlay';
                    overlay.className = 'fixed bottom-6 right-6 bg-gray-900 text-white p-5 rounded-2xl shadow-2xl z-[100] w-80 border border-gray-800 animate-fade-in';
                    document.body.appendChild(overlay);
                }

                            <p class="text-[10px] text-gray-400">Persistent Uploading...</p>

                `;
            },

            async saveProfile() {
                /*
                 * ========================================
                 * SAVE PROFILE - v2.9.3 UPDATE
                 * ========================================
                 * CHANGE: Password handling removed from this function.
                 * Password is now saved separately via savePassword() function.
                 * This provides better UX with a dedicated password update button.
                 * ========================================
                 */
                const btn = document.getElementById('save-profile-btn');
                const origHtml = btn ? btn.innerHTML : '<i class="ph-bold ph-floppy-disk"></i> Save Profile';

                const inputs = document.querySelectorAll('#profile-form input, #profile-form textarea, #profile-form select');
                let updated = { ...this.user };

                let allValid = true;
                inputs.forEach(input => {
                    // Exclude special/optional fields from default validation
                    if (input.name === 'newPassword' || input.name === 'confirmPassword' || input.name === 'gradeLevelCheckbox' || input.name === 'advisoryGrade' || input.name === 'advisorySectionName') return;
                    if (input.required && !input.value.trim()) { allValid = false; input.classList.add('border-red-500'); } else input.classList.remove('border-red-500');
                });
                if (!allValid) { this.toast('Please fill in all required fields.', 'error'); return; }

                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Saving Profile...';
                }
                this.toast('Saving profile information...', 'info');

                try {
                    if (this.tempAvatar) { updated.avatar = this.tempAvatar; this.tempAvatar = null; }
                    inputs.forEach(input => {
                        // Skip password, checkboxes, and special advisory fields
                        if (!input.readOnly && input.name !== 'newPassword' && input.name !== 'confirmPassword' && input.name !== 'gradeLevelCheckbox' && input.name !== 'advisoryGrade' && input.name !== 'advisorySectionName') {
                            updated[input.name] = input.value;
                        }
                    });

                    // Collect Multi-Select Grade Levels Handled Checkboxes
                    const checkedGrades = Array.from(document.querySelectorAll('input[name="gradeLevelCheckbox"]:checked')).map(cb => cb.value);
                    updated.gradeLevel = checkedGrades.join(', ');

                    // Handle Advisory Section separation & formatting (ALL CAPS for Section Name)
                    if (updated.designation === 'Class Adviser') {
                        const advGrade = (document.getElementById('advisoryGradeInput')?.value || '').trim();
                        const advName = (document.getElementById('advisorySectionNameInput')?.value || '').trim().toUpperCase();

                        updated.advisoryGrade = advGrade;
                        updated.advisorySectionName = advName;

                        if (advGrade && advName) {
                            updated.advisorySection = `${advGrade} - ${advName}`;
                        } else if (advName) {
                            updated.advisorySection = advName;
                        } else if (advGrade) {
                            updated.advisorySection = advGrade;
                        } else {
                            updated.advisorySection = '';
                        }
                    } else {
                        updated.advisorySection = '';
                        updated.advisoryGrade = '';
                        updated.advisorySectionName = '';
                    }

                    updated.profileCompleted = true;
                    this.user = updated;
                    this.saveSession();

                    await this.api('updateProfile', updated);
                    this.toast('Profile updated successfully');
                    this.router('profile');
                } catch (err) {
                    this.toast('Failed to save profile: ' + (err.message || err), 'error');
                } finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = origHtml;
                    }
                }
            },

            async savePassword() {

                    btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Updating Password...';

            // ==========================================
            // v4.1.0: SCHOOL EVENTS CALENDAR WIDGET & 15-DAYS AHEAD LIST
            // ==========================================
            normalizeEventDate(eventDateStr) {
                if (!eventDateStr) return null;
                let str = String(eventDateStr).trim();
                if (!str) return null;

                // ISO timestamp strings (e.g., "2027-05-19T16:00:00.000Z") or full Date strings
                if (str.includes('T') || str.includes('Z') || str.includes('GMT') || (str.includes(' ') && !str.match(/^\d{4}-\d{2}-\d{2}$/))) {
                    const parsed = new Date(str);
                    if (!isNaN(parsed.getTime())) {
                        // Extract local year, month, and day in user's browser timezone
                        return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
                    }
                }

                // Standard YYYY-MM-DD or YYYY/MM/DD
                const match = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
                if (match) {
                    const [_, y, m, d] = match;
                    return new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
                }

                const fallbackDate = new Date(str);
                if (!isNaN(fallbackDate.getTime())) {
                    return new Date(fallbackDate.getFullYear(), fallbackDate.getMonth(), fallbackDate.getDate());
                }
                return null;
            },

            formatEventDateKey(eventDateStr) {
                const d = this.normalizeEventDate(eventDateStr);
                if (!d) return '';
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            },

            renderCalendarWidget() {
                const month = this.calendarMonth;
                const year = this.calendarYear;
                const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

                // Map events for this month
                const eventMap = {};
                (this.events || []).forEach(evt => {
                    if (!evt.eventDate) return;
                    const d = this.normalizeEventDate(evt.eventDate);
                    if (d && d.getMonth() === month && d.getFullYear() === year) {
                        const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        if (!eventMap[key]) eventMap[key] = [];
                        eventMap[key].push(evt);
                    }
                });

                const selectedDateStr = this.calendarSelectedDate;
                const selectedEvents = selectedDateStr && eventMap[selectedDateStr] ? eventMap[selectedDateStr] : [];

                // Compact Calendar Grid Cells
                let calCells = '';
                for (let i = 0; i < firstDay; i++) calCells += '<div class="h-7"></div>';
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const hasEvent = eventMap[dateStr] && eventMap[dateStr].length > 0;
                    const isToday = dateStr === todayStr;
                    const isSelected = dateStr === selectedDateStr;
                    calCells += `
                        <button onclick="App.calendarSelectDate('${dateStr}')"
                            class="h-7 w-full rounded-md text-[11px] font-medium relative transition-all flex items-center justify-center
                            ${isSelected ? 'bg-brand-600 text-white shadow' : isToday ? 'bg-brand-50 text-brand-700 font-bold ring-1 ring-brand-300' : 'hover:bg-gray-100 text-gray-700'}">
                            ${d}
                            ${hasEvent ? `<span class="absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full ${isSelected ? 'bg-white' : 'bg-brand-500'}"></span>` : ''}
                        </button>`;
                }

                // --- 15-DAYS AHEAD UPCOMING EVENTS ---
                const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const fifteenDaysLater = new Date(todayStart.getTime() + 15 * 24 * 60 * 60 * 1000);

                const upcomingEvents = (this.events || []).filter(evt => {
                    if (!evt.eventDate) return false;
                    const d = this.normalizeEventDate(evt.eventDate);
                    return d && d >= todayStart && d <= fifteenDaysLater;
                }).sort((a, b) => {
                    const dA = this.normalizeEventDate(a.eventDate);
                    const dB = this.normalizeEventDate(b.eventDate);
                    return (dA ? dA.getTime() : 0) - (dB ? dB.getTime() : 0);
                });

                let upcomingHtml = '';
                if (upcomingEvents.length > 0) {
                    upcomingHtml = upcomingEvents.map(evt => {
                        const evtDateObj = this.normalizeEventDate(evt.eventDate) || new Date();
                        const monthShort = evtDateObj.toLocaleDateString('en-US', { month: 'short' });
                        const dayNum = evtDateObj.getDate();
                        const dayOfWeek = evtDateObj.toLocaleDateString('en-US', { weekday: 'short' });
                        const evtFormattedDateStr = this.formatEventDateKey(evt.eventDate);

                        return `
                            <div class="bg-gray-50 border border-gray-100 rounded-xl p-2.5 flex items-start gap-2.5 hover:border-brand-200 hover:bg-white transition-all group">
                                <div class="bg-brand-600 text-white rounded-lg p-1.5 min-w-[40px] text-center flex-shrink-0">
                                    <span class="block text-[9px] font-bold uppercase tracking-wider leading-none opacity-80">${monthShort}</span>
                                    <span class="block text-sm font-extrabold leading-tight mt-0.5">${dayNum}</span>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-start justify-between gap-1">
                                        <h5 class="text-xs font-bold text-gray-900 truncate group-hover:text-brand-600 transition-colors">${evt.title}</h5>
                                        ${(this.canManageEvents() && (this.isDev() || this.isPrincipal() || (this.user && String(evt.userId) === String(this.user.id)))) ? `
                                            <div class="flex gap-1 flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onclick="event.stopPropagation();App.openEventEditor('${evtFormattedDateStr}','${evt.id}')" class="text-gray-400 hover:text-brand-600 p-0.5"><i class="ph ph-pencil-simple text-xs"></i></button>
                                                <button onclick="event.stopPropagation();App.deleteEvent('${evt.id}')" class="text-gray-400 hover:text-red-600 p-0.5"><i class="ph ph-trash text-xs"></i></button>
                                            </div>
                                        ` : ''}
                                    </div>
                                    ${evt.description ? `<p class="text-[11px] text-gray-500 line-clamp-2 mt-0.5 leading-snug">${evt.description}</p>` : ''}
                                    <p class="text-[9px] text-gray-400 mt-1">${dayOfWeek} • ${evt.userName || 'School Event'}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    upcomingHtml = `<p class="text-xs text-gray-400 text-center py-3 bg-gray-50 rounded-xl border border-dashed border-gray-200">No events in the next 15 days.</p>`;
                }

                // Selected date highlight box
                let selectedDateBox = '';
                if (selectedDateStr) {
                    const selDateObj = this.normalizeEventDate(selectedDateStr);
                    const selFormatted = selDateObj ? selDateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : selectedDateStr;
                    if (selectedEvents.length > 0) {
                        selectedDateBox = `
                            <div class="mb-3 p-3 bg-brand-50/70 border border-brand-200 rounded-xl animate-fade-in">
                                <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-brand-200/60">
                                    <span class="text-xs font-extrabold text-brand-900 flex items-center gap-1.5">
                                        <i class="ph-fill ph-calendar-blank text-brand-600"></i> Events on ${selFormatted}
                                    </span>
                                    <button onclick="App.calendarSelectDate(null)" class="text-[11px] font-bold text-gray-500 hover:text-gray-800 bg-white/80 hover:bg-white px-2 py-0.5 rounded-md border border-gray-200 transition-colors flex items-center gap-1">
                                        <i class="ph ph-x text-xs"></i> Close Filter
                                    </button>
                                </div>
                                <div class="space-y-2">
                                    ${selectedEvents.map(evt => {
                            const canManageThisEvt = this.canManageEvents() && (this.isDev() || this.isPrincipal() || (this.user && String(evt.userId) === String(this.user.id)));
                            return `
                                            <div class="p-2.5 bg-white rounded-lg border border-brand-100 shadow-sm flex flex-col gap-1.5">
                                                <div class="flex items-start justify-between gap-2">
                                                    <div class="font-bold text-xs text-gray-900 leading-snug">📌 ${evt.title}</div>
                                                    ${canManageThisEvt ? `
                                                        <div class="flex items-center gap-1 flex-shrink-0">
                                                            <button onclick="event.stopPropagation();App.openEventEditor('${selectedDateStr}','${evt.id}')" title="Edit Event" class="text-brand-600 hover:text-brand-800 bg-brand-50 hover:bg-brand-100 p-1 rounded-md transition-colors">
                                                                <i class="ph-bold ph-pencil-simple text-xs"></i>
                                                            </button>
                                                            <button onclick="event.stopPropagation();App.deleteEvent('${evt.id}')" title="Delete Event" class="text-red-600 hover:text-red-800 bg-red-50 hover:bg-red-100 p-1 rounded-md transition-colors flex items-center gap-1 px-2 py-0.5 text-[10px] font-bold">
                                                                <i class="ph-bold ph-trash text-xs"></i> Delete
                                                            </button>
                                                        </div>
                                                    ` : ''}
                                                </div>
                                                ${evt.description ? `<p class="text-[11px] text-gray-600 leading-relaxed">${evt.description}</p>` : ''}
                                                <div class="text-[9px] text-gray-400">By ${evt.userName || 'School Event'}</div>
                                            </div>
                                        `;
                        }).join('')}
                                </div>
                            </div>
                        `;
                    } else {
                        selectedDateBox = `
                            <div class="mb-3 p-2.5 bg-gray-50 border border-gray-200 rounded-xl flex justify-between items-center text-xs animate-fade-in">
                                <span class="text-gray-500 text-[11px]">No events on ${selFormatted}</span>
                                <button onclick="App.calendarSelectDate(null)" class="text-[10px] font-bold text-gray-500 hover:text-gray-700">Close Filter</button>
                            </div>
                        `;
                    }
                }

                return `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 space-y-3.5 animate-slide-up">
                        <!-- CALENDAR HEADER -->
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold text-gray-900 uppercase tracking-wider flex items-center gap-1.5">
                                <i class="ph-fill ph-calendar text-brand-600 text-base"></i> School Calendar
                            </h3>
                            ${this.canManageEvents() ? `<button onclick="App.openEventEditor()" class="text-[10px] font-bold bg-brand-50 text-brand-600 hover:bg-brand-100 px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1"><i class="ph-bold ph-plus text-[10px]"></i> Event</button>` : ''}
                        </div>

                        <!-- MONTH SWITCHER -->
                        <div class="flex items-center justify-between bg-gray-50 px-3 py-1 rounded-xl border border-gray-100">
                            <button onclick="App.calendarPrev()" class="w-6 h-6 rounded-md hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors"><i class="ph-bold ph-caret-left text-xs"></i></button>
                            <span class="text-xs font-bold text-gray-800">${monthNames[month]} ${year}</span>
                            <button onclick="App.calendarNext()" class="w-6 h-6 rounded-md hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors"><i class="ph-bold ph-caret-right text-xs"></i></button>
                        </div>

                        <!-- WEEKDAY HEADERS -->
                        <div class="grid grid-cols-7 gap-0.5">
                            ${dayNames.map(d => `<div class="text-center text-[9px] font-bold text-gray-400 uppercase py-0.5">${d}</div>`).join('')}
                        </div>

                        <!-- CALENDAR DAYS GRID -->
                        <div class="grid grid-cols-7 gap-0.5">
                            ${calCells}
                        </div>

                        ${selectedDateBox}

                        <!-- INCOMING EVENTS (15-DAYS AHEAD) SECTION -->
                        <div class="pt-3 border-t border-gray-100">
                            <div class="flex items-center justify-between mb-2">
                                <h4 class="text-xs font-bold text-gray-800 flex items-center gap-1.5">
                                    <i class="ph-fill ph-clock text-amber-500"></i> Next 15 Days Events
                                </h4>
                                <span class="text-[10px] text-gray-400 font-medium">${upcomingEvents.length} event${upcomingEvents.length === 1 ? '' : 's'}</span>
                            </div>
                            <div class="space-y-2 max-h-64 overflow-y-auto custom-scroll pr-1">
                                ${upcomingHtml}
                            </div>
                        </div>
                    </div>
                `;
            },

            calendarSelectDate(dateStr) {
                this.calendarSelectedDate = (this.calendarSelectedDate === dateStr) ? null : dateStr;
                const mainView = document.getElementById('main-view');
                if (mainView) {
                    if (this.user) this.renderHome(mainView);
                    else this._renderGuestHTML(mainView);
                }
            },

            calendarPrev() {
                this.calendarMonth--;
                if (this.calendarMonth < 0) { this.calendarMonth = 11; this.calendarYear--; }
                this.calendarSelectedDate = null;
                const mainView = document.getElementById('main-view');
                if (mainView) {
                    if (this.user) this.renderHome(mainView);
                    else this._renderGuestHTML(mainView);
                }
            },

            calendarNext() {
                this.calendarMonth++;
                if (this.calendarMonth > 11) { this.calendarMonth = 0; this.calendarYear++; }
                this.calendarSelectedDate = null;
                const mainView = document.getElementById('main-view');
                if (mainView) {
                    if (this.user) this.renderHome(mainView);
                    else this._renderGuestHTML(mainView);
                }
            },

            openEventEditor(prefillDate, editId) {
                let existing = null;
                if (editId) {
                    existing = (this.events || []).find(e => String(e.id) === String(editId));
                }

                const todayStr = new Date().toISOString().split('T')[0];
                const dateVal = existing ? (existing.eventDate ? this.formatEventDateKey(existing.eventDate) : '') : (prefillDate || todayStr);

                const html = `
                    <div class="max-w-lg mx-auto">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2"><i class="ph-fill ph-calendar-plus text-brand-600 text-2xl"></i> ${existing ? 'Edit Event' : 'Add Event'}</h3>
                            <button onclick="App.closeModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200"><i class="ph ph-x"></i></button>
                        </div>
                        <form onsubmit="App.saveEvent(event, '${editId || ''}')" class="space-y-4">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-600 block">Event Date</label>
                                <input type="date" name="eventDate" value="${dateVal}" class="input-field text-sm py-2.5" required>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-600 block">Event Title</label>
                                <input type="text" name="title" value="${existing ? existing.title : ''}" placeholder="e.g. Foundation Day, Science Fair..." class="input-field text-sm py-2.5" required>
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-gray-600 block">Description <span class="text-gray-400 font-normal">(optional)</span></label>
                                <textarea name="description" rows="3" placeholder="Details about the event..." class="input-field text-sm py-2.5 resize-none" maxlength="500">${existing ? existing.description || '' : ''}</textarea>
                            </div>
                            <button type="submit" id="event-submit-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                                <i class="ph-bold ph-${existing ? 'floppy-disk' : 'paper-plane-right'}"></i> ${existing ? 'Update Event' : 'Add Event'}
                            </button>
                        </form>
                    </div>
                `;
                this.openModal(html);
            },

            async saveEvent(e, editId) {
                e.preventDefault();
                const form = e.target;
                const btn = document.getElementById('event-submit-btn');
                const origText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Saving...';

                try {
                    const data = {
                        title: form.title.value,
                        description: form.description.value,
                        eventDate: form.eventDate.value
                    };
                    if (editId) data.id = editId;

                    const res = await this.api('saveEvent', data);
                    if (res && res.status === 'success') {
                        // Construct optimistic event entry
                        const newEvt = {
                            id: editId || res.id || ('EVT-' + Date.now()),
                            userId: this.user ? this.user.id : '',
                            userName: this.user ? `${this.user.firstName} ${this.user.lastName}` : 'School Event',
                            userRole: this.user ? this.user.role : 'Faculty',
                            title: data.title,
                            description: data.description,
                            eventDate: data.eventDate,
                            createdAt: new Date().toISOString()
                        };

                        if (!Array.isArray(this.events)) this.events = [];
                        if (editId) {
                            const idx = this.events.findIndex(item => String(item.id) === String(editId));
                            if (idx !== -1) this.events[idx] = { ...this.events[idx], ...newEvt };
                            else this.events.push(newEvt);
                        } else {
                            this.events.push(newEvt);
                        }

                        // Try fetching fresh list from API in background to sync backend IDs/fields
                        try {
                            const evtRes = await this.api('getEvents', {}, true);
                            if (evtRes && Array.isArray(evtRes.events) && evtRes.events.length > 0) {
                                this.events = evtRes.events;
                            }
                        } catch (e) { }

                        // Persist to local IndexedDB cache
                        try {
                            LocalDB.set('cache', DB_CACHE_DATA, {
                                users: this.users,
                                posts: this.posts,
                                groups: this.groups,
                                reportTypes: this.reportTypes,
                                reports: this.reports,
                                settings: this.settings,
                                events: this.events
                            });
                        } catch (e) { }

                        this.toast(editId ? 'Event updated!' : 'Event added to calendar!');
                        this.closeModal();

                        // Re-render active view
                        const mainView = document.getElementById('main-view');
                        if (mainView) {
                            if (this.user) this.renderHome(mainView);
                            else this._renderGuestHTML(mainView);
                        }
                    } else {
                        throw new Error(res?.message || 'Failed to save event');
                    }
                } catch (err) {
                    this.toast('Failed: ' + err.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = origText;
                }
            },

            async deleteEvent(eventId) {
                try {
                    await this.api('deleteEvent', { id: eventId });
                    this.events = this.events.filter(e => String(e.id) !== String(eventId));
                    try {
                        LocalDB.set('cache', DB_CACHE_DATA, {
                            users: this.users,
                            posts: this.posts,
                            groups: this.groups,
                            reportTypes: this.reportTypes,
                            reports: this.reports,
                            settings: this.settings,
                            events: this.events
                        });
                    } catch (e) { }
                    this.toast('Event deleted.');
                    const mainView = document.getElementById('main-view');
                    if (mainView) {
                        if (this.user) this.renderHome(mainView);
                        else this._renderGuestHTML(mainView);
                    }
                } catch (e) {
                    this.toast('Failed: ' + e.message, 'error');
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            try {
                App.init();
            } catch (e) {
                alert('App Crash: ' + e.message + '\n' + e.stack);
                console.error(e);
            }
        });
    </script>
</body>

</html>
